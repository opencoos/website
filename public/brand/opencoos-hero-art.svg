<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="40 30 600 600" role="img" aria-labelledby="t">
  <title id="t">Pigeons carrying a data card between a strata mid-rise, a condo tower and townhouses</title>
  <defs>
    <symbol id="pigeon" viewBox="0 0 32 32">
      <path d="M10 17.5 L2.5 14.2 C2 14 1.7 14.6 2.1 15 L7.5 20.5 Z" fill="#115e59"/>
      <path d="M7 18.5 C7 13.2 11.5 10.6 16.5 11.2 L19.5 11.8 C24.6 13 27 17.8 25.2 22.2 C23.5 26.2 18 27.6 13.5 26.3 C9.6 25.2 7 22.4 7 18.5 Z" fill="#0f766e"/>
      <path d="M18.6 12.8 C20.4 14.3 23.6 14 25.4 11.9 C25.6 14.6 22.8 16.1 20.4 15.6 C19.5 15.4 18.9 14.4 18.6 12.8 Z" fill="#14b8a6"/>
      <circle cx="21.8" cy="9.4" r="4.4" fill="#0f766e"/>
      <path d="M25.9 8.6 L29.3 9.8 L25.9 11 Z" fill="#f59e0b"/>
      <circle cx="22.9" cy="8.5" r="1.55" fill="#fff"/><circle cx="23.3" cy="8.5" r="0.8" fill="#0f172a"/>
      <path d="M12.6 15 c1.9 0 2.4 0.7 2.4 2 v1.1 c0 1 0.5 1.5 1.7 1.5 c-1.2 0 -1.7 0.5 -1.7 1.5 v1.1 c0 1.3 -0.5 2 -2.4 2" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 26.6 v2.6 M19.2 26.2 v3" stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="pigeon-fly" viewBox="0 0 32 32" overflow="visible">
      <path d="M11 14 C10 7.5 13.5 2.5 19.5 0.5 C18.4 5 18.6 9.4 20 12.4 Z" fill="#115e59"/>
      <use href="#pigeon" x="0" y="0" width="32" height="32"/>
    </symbol>
    <pattern id="win" width="28" height="30" patternUnits="userSpaceOnUse"><rect x="7" y="8" width="14" height="16" rx="2" fill="#ccfbf1"/></pattern>
    <pattern id="win2" width="26" height="28" patternUnits="userSpaceOnUse"><rect x="6" y="7" width="14" height="14" rx="2" fill="#99f6e4"/></pattern>
  
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ccfbf1" stroke-width="1"/></pattern>
  </defs>
  <rect x="40" y="30" width="600" height="600" fill="#f0fdfa"/>
  <rect x="40" y="30" width="600" height="600" fill="url(#grid)"/>
  <rect x="40" y="560" width="600" height="70" fill="#ccfbf1"/>
  <path d="M40 560H640" stroke="#99f6e4" stroke-width="2"/>

  <!-- ground -->
  <!-- condo tower -->
  <rect x="300" y="170" width="168" height="390" rx="6" fill="#115e59"/>
  <rect x="300" y="170" width="168" height="390" rx="6" fill="url(#win)" transform="translate(0,6)"/>
  <rect x="290" y="160" width="188" height="16" rx="4" fill="#0f766e"/>
  <!-- strata mid-rise -->
  <rect x="96" y="330" width="176" height="230" rx="6" fill="#0f766e"/>
  <rect x="96" y="336" width="176" height="224" fill="url(#win2)"/>
  <path d="M84 334 L184 280 L284 334 Z" fill="#115e59"/>
  <!-- townhouses -->
  <rect x="488" y="420" width="118" height="140" rx="4" fill="#14b8a6"/>
  <path d="M480 424 L517 384 L554 424 Z M540 424 L577 384 L614 424 Z" fill="#0f766e"/>
  <rect x="506" y="470" width="22" height="30" rx="2" fill="#f0fdfa"/><rect x="566" y="470" width="22" height="30" rx="2" fill="#f0fdfa"/>
  <rect x="512" y="522" width="16" height="38" rx="2" fill="#115e59"/><rect x="572" y="522" width="16" height="38" rx="2" fill="#115e59"/>
  <!-- data route between buildings -->
  <path d="M190 270 C230 150 330 90 384 150" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <path d="M384 150 C420 70 540 70 560 210 C570 300 560 340 548 372" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- pigeon on the tower roof -->
  <use href="#pigeon" x="338" y="66" width="96" height="96"/>
  <!-- pigeon on the mid-rise roof -->
  <use href="#pigeon" x="150" y="214" width="72" height="72"/>
  <!-- flying pigeon carrying a data card -->
  <g transform="translate(482 92) rotate(-6)">
    <path d="M44 56 L40 82" stroke="#0f766e" stroke-width="2"/>
    <rect x="8" y="80" width="66" height="44" rx="6" fill="#fff" stroke="#0f766e" stroke-width="2.5"/>
    <text x="41" y="110" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="700" font-size="22" fill="#0f766e">{ }</text>
    <use href="#pigeon-fly" x="0" y="0" width="76" height="76"/>
  </g>

</svg>
